  <rect x="618" y="76" width="56" height="26" rx="8" fill="#5B7CFA" fill-opacity="0.15" stroke="#5B7CFA" stroke-opacity="0.5"/>
  <text x="646" y="93" fill="#5B7CFA" font-size="10" font-weight="600" text-anchor="middle">外观</text>
  <rect x="618" y="108" width="56" height="26" rx="8" fill="none"/>
