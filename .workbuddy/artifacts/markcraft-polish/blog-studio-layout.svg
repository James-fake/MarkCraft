  <!-- device frame (unified) -->
  <rect x="232" y="104" width="372" height="320" rx="12" fill="#fff"/>
  <rect x="232" y="104" width="372" height="320" rx="12" fill="none" stroke="#292E30" stroke-width="1"/>
  <text x="418" y="150" fill="#1A1C24" font-size="18" font-weight="800" text-anchor="middle">第一篇文章</text>
  <rect x="300" y="170" width="236" height="6" rx="3" fill="#1A1C24" fill-opacity="0.1"/>
  <rect x="300" y="186" width="236" height="6" rx="3" fill="#1A1C24" fill-opacity="0.1"/>
  <rect x="300" y="202" width="180" height="6" rx="3" fill="#1A1C24" fill-opacity="0.1"/>
  <rect x="300" y="232" width="236" height="40" rx="6" fill="#1A1C24" fill-opacity="0.06"/>
  <rect x="300" y="288" width="236" height="6" rx="3" fill="#1A1C24" fill-opacity="0.1"/>
  <rect x="300" y="304" width="200" height="6" rx="3" fill="#1A1C24" fill-opacity="0.1"/>
  <rect x="300" y="348" width="120" height="28" rx="8" fill="#5B7CFA"/>
  <text x="360" y="367" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">阅读全文</text>
