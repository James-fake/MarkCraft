  <rect x="618" y="172" width="56" height="26" rx="8" fill="none"/>
  <text x="646" y="189" fill="#8A8F9C" font-size="10" text-anchor="middle">特性</text>
  <rect x="618" y="204" width="56" height="26" rx="8" fill="none"/>
  <text x="646" y="221" fill="#8A8F9C" font-size="10" text-anchor="middle">CSS</text>
  <rect x="618" y="236" width="56" height="26" rx="8" fill="none"/>
  <text x="646" y="253" fill="#8A8F9C" font-size="10" text-anchor="middle">发布</text>
</svg>
