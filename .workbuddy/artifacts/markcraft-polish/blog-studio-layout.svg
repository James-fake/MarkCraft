<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="Inter, -apple-system, sans-serif">
  <!-- bg -->
  <rect width="680" height="460" rx="14" fill="#0E0F17"/>
  <rect x="0.5" y="0.5" width="679" height="459" rx="14" fill="none" stroke="#292E30"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="680" height="40" fill="#14161F"/>
