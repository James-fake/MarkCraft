  <rect x="120" y="164" width="36" height="16" rx="8" fill="#E0A23B" fill-opacity="0.18" stroke="#E0A23B" stroke-opacity="0.5"/>
  <text x="138" y="176" fill="#E0A23B" font-size="9" font-weight="600" text-anchor="middle">草稿</text>
  <rect x="16" y="204" width="148" height="40" rx="8" fill="#14161F"/>
  <text x="26" y="222" fill="#E6E8EF" font-size="11">读书笔记</text>
  <text x="26" y="236" fill="#8A8F9C" font-size="9">8月5日 · 2,010 字</text>
  <rect x="120" y="212" width="36" height="16" rx="8" fill="#1FA45C" fill-opacity="0.18" stroke="#1FA45C" stroke-opacity="0.5"/>
  <text x="138" y="224" fill="#1FA45C" font-size="9" font-weight="600" text-anchor="middle">已发布</text>
  <rect x="16" y="420" width="148" height="28" rx="8" fill="#5B7CFA" fill-opacity="0.12" stroke="#5B7CFA" stroke-opacity="0.4"/>
