<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MarkCraft — 视觉精修原型 · 命令面板</title>
<style>
  :root {
    --page:#F6F7F9; --panel:#EEF0F4; --card:#FFFFFF; --border:#E3E6EC; --edge:#E2E4EC;
    --t1:#1A1D24; --t2:#5A606B; --t3:#8A909C; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.10);
    --success:#1FA45C; --success-soft:rgba(31,164,92,.12);
    --elev-1:0 1px 2px rgba(20,24,36,.05),0 1px 3px rgba(20,24,36,.06);
    --elev-2:0 6px 16px rgba(20,24,36,.10);
    --elev-3:0 18px 48px rgba(20,24,36,.20),0 4px 12px rgba(20,24,36,.12);
    --r-win:14px; --r-panel:10px; --r-ctrl:8px; --r-chip:7px; --sb:#F0F2F6;
  }
  [data-theme="dark"] {
    --page:#14161C; --panel:#181B22; --card:#1C1F27; --border:#2A2E38; --edge:#333845;
    --t1:#E8EAF0; --t2:#9AA0AC; --t3:#6B7180; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.14);
    --success:#3DD68C; --success-soft:rgba(61,214,140,.14);
    --elev-1:0 1px 2px rgba(0,0,0,.35);
    --elev-2:0 6px 16px rgba(0,0,0,.45);
    --elev-3:0 18px 48px rgba(0,0,0,.60),0 4px 12px rgba(0,0,0,.45);
    --sb:#20232C;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Inter',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--page); color:var(--t1); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px; transition:.3s ease;
  }
  .window { width:1080px; height:680px; border-radius:var(--r-win); background:var(--panel);
    box-shadow:var(--elev-3); overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--border); transition:.3s ease; }
  .titlebar { height:46px; flex:0 0 46px; display:flex; align-items:center; padding:0 14px;
    background:var(--card); border-bottom:1px solid var(--border); transition:.3s ease; }
  .traffic { display:flex; gap:8px; }
  .traffic i { width:12px; height:12px; border-radius:50%; display:block; }
  .traffic .r{background:#FF5F57;} .traffic .y{background:#FEBC2E;} .traffic .g{background:#28C840;}
  .title-center { flex:1; text-align:center; font-size:13px; font-weight:500; color:var(--t2); letter-spacing:.2px; }
  .title-right { display:flex; gap:6px; }
  .ico-btn { width:30px; height:30px; border-radius:var(--r-ctrl); display:flex; align-items:center; justify-content:center;
    color:var(--t2); cursor:pointer; border:1px solid transparent; background:transparent; transition:.15s ease; }
  .ico-btn:hover { background:var(--accent-soft); color:var(--accent); }
  .ico-btn:active { transform:scale(.96); }
  .ico-btn svg { width:16px; height:16px; }
  .body { flex:1; display:flex; min-height:0; }
  .sidebar { width:240px; flex:0 0 240px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:14px 10px; transition:.3s ease; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 14px; }
  .brand .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--accent),#8AA2FF);
    color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:var(--elev-1); }
  .brand .name { font-size:14px; font-weight:600; color:var(--t1); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-ctrl);
    font-size:13px; color:var(--t2); cursor:pointer; position:relative; transition:.15s ease; }
  .nav-item svg { width:17px; height:17px; }
  .nav-item:hover { background:var(--card); color:var(--t1); }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .nav-item.active::before { content:""; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:3px; background:var(--accent); }
  .main { flex:1; position:relative; background:var(--page); transition:.3s ease; }
  .behind { position:absolute; inset:0; opacity:.45; padding:40px; filter:saturate(.6); }
  .behind h1 { font-size:22px; color:var(--t1); font-weight:600; margin-bottom:10px; }
  .behind p { color:var(--t2); font-size:14px; line-height:1.7; max-width:520px; }
  .scrim { position:absolute; inset:0; background:rgba(10,12,18,.42); backdrop-filter:blur(3px); }
  /* palette */
  .palette { position:absolute; left:50%; top:14%; transform:translateX(-50%); width:600px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-panel); box-shadow:var(--elev-3);
    overflow:hidden; transition:.3s ease; }
  .p-search { display:flex; align-items:center; gap:11px; padding:15px 18px; border-bottom:1px solid var(--border); }
  .p-search svg { width:18px; height:18px; color:var(--t3); flex:0 0 18px; }
  .p-search input { flex:1; border:none; outline:none; background:transparent; font-size:15px; color:var(--t1);
    font-family:inherit; }
  .p-search input::placeholder { color:var(--t3); }
  .p-search .kbd { font-size:11px; color:var(--t2); border:1px solid var(--border); border-radius:4px;
    padding:1px 6px; background:var(--sb); }
  .p-list { padding:8px; max-height:340px; overflow:auto; }
  .p-group { font-size:10.5px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.6px;
    padding:10px 12px 5px; }
  .p-item { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--r-ctrl);
    font-size:13.5px; color:var(--t2); cursor:pointer; transition:.12s ease; }
  .p-item svg { width:17px; height:17px; flex:0 0 17px; }
  .p-item .label { color:var(--t1); font-weight:500; }
  .p-item:hover, .p-item.active { background:var(--accent-soft); color:var(--accent); }
  .p-item:hover .label, .p-item.active .label { color:var(--accent); }
  .p-item .kbd-r { margin-left:auto; font-size:11px; color:var(--t3); border:1px solid var(--border);
    border-radius:4px; padding:1px 6px; background:var(--sb); }
  .p-item.active .kbd-r { color:var(--accent); border-color:transparent; background:var(--card); }
  .p-foot { display:flex; align-items:center; gap:16px; padding:9px 16px; border-top:1px solid var(--border);
    font-size:11px; color:var(--t3); }
  .p-foot .kk { display:flex; align-items:center; gap:5px; }
  .p-foot .kk b { border:1px solid var(--border); border-radius:4px; padding:0 5px; background:var(--sb); font-weight:500; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="title-center">MarkCraft — 命令面板（视觉精修原型）</div>
      <div class="title-right">
        <button class="ico-btn" id="themeBtn" title="切换明暗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="body">
      <aside class="sidebar">
        <div class="brand"><div class="logo">M</div><div class="name">MarkCraft</div></div>
        <nav class="nav">
          <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg>笔记
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.3l3 9M15.8 7.3l-3 9"/></svg>知识图谱
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 18v2M16 18v2"/></svg>白板
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>知识库
          </div>
        </nav>
      </aside>
      <section class="main">
        <div class="behind">
          <h1>双主题设计稿</h1>
          <p>按 ⌘K 唤起命令面板。这是桌面范式的核心入口——所有导航、操作、插入都可在不离开键盘的情况下完成，凸显工具级定位。</p>
        </div>
        <div class="scrim"></div>

        <div class="palette">
          <div class="p-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input value="切换" placeholder="搜索命令、页面、文件…" />
            <span class="kbd">⌘K</span>
          </div>
          <div class="p-list">
            <div class="p-group">导航</div>
            <div class="p-item active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg>
              <span class="label">切换到「笔记」</span><span class="kbd-r">⌘1</span>
            </div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.3l3 9M15.8 7.3l-3 9"/></svg>
              <span class="label">打开「知识图谱」</span><span class="kbd-r">⌘2</span>
            </div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 18v2M16 18v2"/></svg>
              <span class="label">打开「白板」</span><span class="kbd-r">⌘3</span>
            </div>
            <div class="p-group">操作</div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              <span class="label">新建笔记</span><span class="kbd-r">⌘N</span>
            </div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>
              <span class="label">导出为 PDF</span><span class="kbd-r">⌘E</span>
            </div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
              <span class="label">切换明暗主题</span><span class="kbd-r">⌘⇧L</span>
            </div>
            <div class="p-group">插入</div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
              <span class="label">插入表格</span>
            </div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8M8 12h8M8 16h5"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
              <span class="label">插入代码块</span>
            </div>
            <div class="p-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
              <span class="label">插入数学公式</span>
            </div>
          </div>
          <div class="p-foot">
            <span class="kk"><b>↑</b><b>↓</b> 选择</span>
            <span class="kk"><b>↵</b> 执行</span>
            <span class="kk"><b>esc</b> 关闭</span>
          </div>
        </div>
      </section>
    </div>
  </div>

<script>
  const root = document.documentElement;
  document.getElementById('themeBtn').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  document.querySelectorAll('.p-item').forEach(it => it.addEventListener('mousemove', () => {
    document.querySelectorAll('.p-item').forEach(x => x.classList.remove('active'));
    it.classList.add('active');
  }));
</script>
</body>
</html>
