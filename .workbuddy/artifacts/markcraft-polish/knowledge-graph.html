<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MarkCraft — 视觉精修原型 · 知识图谱</title>
<style>
  :root {
    --page:#F6F7F9; --panel:#EEF0F4; --card:#FFFFFF; --border:#E3E6EC; --edge:#E2E4EC;
    --t1:#1A1D24; --t2:#5A606B; --t3:#8A909C; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.10);
    --success:#1FA45C; --success-soft:rgba(31,164,92,.12);
    --elev-1:0 1px 2px rgba(20,24,36,.05),0 1px 3px rgba(20,24,36,.06);
    --elev-2:0 6px 16px rgba(20,24,36,.10);
    --elev-3:0 18px 48px rgba(20,24,36,.20),0 4px 12px rgba(20,24,36,.12);
    --r-win:14px; --r-panel:10px; --r-ctrl:8px; --r-chip:7px;
    --sb:#F0F2F6;
  }
  [data-theme="dark"] {
    --page:#14161C; --panel:#181B22; --card:#1C1F27; --border:#2A2E38; --edge:#333845;
    --t1:#E8EAF0; --t2:#9AA0AC; --t3:#6B7180; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.14);
    --success:#3DD68C; --success-soft:rgba(61,214,140,.14);
    --elev-1:0 1px 2px rgba(0,0,0,.35);
    --elev-2:0 6px 16px rgba(0,0,0,.45);
    --elev-3:0 18px 48px rgba(0,0,0,.60),0 4px 12px rgba(0,0,0,.45);
    --sb:#20232C;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Inter',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--page); color:var(--t1); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px;
    transition:background .3s ease,color .3s ease;
  }
  .window {
    width:1080px; height:680px; border-radius:var(--r-win); background:var(--panel);
    box-shadow:var(--elev-3); overflow:hidden; display:flex; flex-direction:column;
    border:1px solid var(--border); transition:.3s ease;
  }
  /* title bar */
  .titlebar { height:46px; flex:0 0 46px; display:flex; align-items:center; padding:0 14px;
    background:var(--card); border-bottom:1px solid var(--border); transition:.3s ease; }
  .traffic { display:flex; gap:8px; }
  .traffic i { width:12px; height:12px; border-radius:50%; display:block; }
  .traffic .r{background:#FF5F57;} .traffic .y{background:#FEBC2E;} .traffic .g{background:#28C840;}
  .title-center { flex:1; text-align:center; font-size:13px; font-weight:500; color:var(--t2); letter-spacing:.2px; }
  .title-right { display:flex; gap:6px; }
  .ico-btn { width:30px; height:30px; border-radius:var(--r-ctrl); display:flex; align-items:center; justify-content:center;
    color:var(--t2); cursor:pointer; border:1px solid transparent; background:transparent; transition:.15s ease; }
  .ico-btn:hover { background:var(--accent-soft); color:var(--accent); }
  .ico-btn:active { transform:scale(.96); }
  .ico-btn svg { width:16px; height:16px; }
  /* body */
  .body { flex:1; display:flex; min-height:0; }
  /* sidebar */
  .sidebar { width:240px; flex:0 0 240px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:14px 10px; transition:.3s ease; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 14px; }
  .brand .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--accent),#8AA2FF);
    color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:var(--elev-1); }
  .brand .name { font-size:14px; font-weight:600; color:var(--t1); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-ctrl);
    font-size:13px; color:var(--t2); cursor:pointer; position:relative; transition:.15s ease; }
  .nav-item svg { width:17px; height:17px; }
  .nav-item:hover { background:var(--card); color:var(--t1); }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .nav-item.active::before { content:""; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:3px; background:var(--accent); }
  .tree-head { font-size:11px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.6px; padding:16px 10px 6px; }
  .tree { display:flex; flex-direction:column; gap:1px; overflow:auto; flex:1; }
  .tree-item { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px;
    font-size:13px; color:var(--t2); cursor:pointer; transition:.15s ease; }
  .tree-item svg { width:15px; height:15px; flex:0 0 15px; }
  .tree-item:hover { background:var(--card); color:var(--t1); }
  .tree-item.active { background:var(--accent-soft); color:var(--accent); }
  .tree-item .depth { margin-left:14px; }
  /* main */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--page); transition:.3s ease; }
  .topbar { height:50px; flex:0 0 50px; display:flex; align-items:center; gap:12px; padding:0 16px;
    border-bottom:1px solid var(--border); background:var(--card); transition:.3s ease; }
  .crumb { font-size:13px; color:var(--t2); display:flex; align-items:center; gap:6px; }
  .crumb b { color:var(--t1); font-weight:600; }
  .search-chip { margin-left:8px; display:flex; align-items:center; gap:8px; padding:7px 12px; min-width:200px;
    background:var(--page); border:1px solid var(--border); border-radius:var(--r-chip); color:var(--t3);
    font-size:12px; cursor:text; transition:.15s ease; box-shadow:var(--elev-1); }
  .search-chip:hover { border-color:var(--accent); }
  .search-chip svg { width:14px; height:14px; }
  .search-chip .kbd { margin-left:auto; font-size:11px; color:var(--t2); border:1px solid var(--border);
    border-radius:4px; padding:1px 5px; background:var(--card); }
  .seg { margin-left:auto; display:flex; background:var(--page); border:1px solid var(--border);
    border-radius:var(--r-ctrl); padding:3px; gap:2px; }
  .seg button { border:none; background:transparent; color:var(--t2); font-size:12px; padding:5px 11px;
    border-radius:6px; cursor:pointer; font-family:inherit; transition:.15s ease; display:flex; align-items:center; gap:6px; }
  .seg button svg { width:14px; height:14px; }
  .seg button.on { background:var(--card); color:var(--t1); box-shadow:var(--elev-1); font-weight:500; }
  .graph-wrap { flex:1; display:flex; min-height:0; }
  .canvas { flex:1; position:relative; overflow:hidden; }
  .canvas .grid { position:absolute; inset:0; opacity:.5;
    background-image:radial-gradient(var(--border) 1px, transparent 1px); background-size:22px 22px; }
  .canvas svg { position:absolute; inset:0; width:100%; height:100%; }
  .gnode { cursor:pointer; transition:transform .15s ease; }
  .gnode:hover { transform:translateY(-1px); }
  .gnode rect { transition:.15s ease; }
  .gnode:hover rect { filter:drop-shadow(0 6px 14px rgba(20,24,36,.18)); }
  /* detail panel */
  .detail { width:268px; flex:0 0 268px; background:var(--card); border-left:1px solid var(--border);
    display:flex; flex-direction:column; transition:.3s ease; }
  .detail-head { padding:16px 16px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:11px; }
  .detail-head .ni { width:34px; height:34px; border-radius:9px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:0 0 34px; }
  .detail-head .ni svg { width:18px; height:18px; }
  .detail-head .nt { font-size:14px; font-weight:600; color:var(--t1); }
  .detail-head .ns { font-size:11px; color:var(--t3); margin-top:1px; }
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; color:var(--accent);
    background:var(--accent-soft); padding:2px 8px; border-radius:999px; }
  .detail-body { padding:14px 16px; overflow:auto; flex:1; }
  .meta-row { display:flex; justify-content:space-between; font-size:12px; padding:7px 0; border-bottom:1px dashed var(--border); }
  .meta-row .k { color:var(--t3); }
  .meta-row .v { color:var(--t2); font-weight:500; }
  .list-cap { font-size:11px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.5px;
    margin:16px 0 8px; }
  .link-item { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--r-ctrl);
    font-size:13px; color:var(--t2); background:var(--panel); margin-bottom:5px; cursor:pointer; transition:.15s ease; }
  .link-item:hover { background:var(--sb); color:var(--t1); }
  .link-item .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:0 0 7px; }
  /* status bar */
  .statusbar { height:30px; flex:0 0 30px; display:flex; align-items:center; gap:16px; padding:0 16px;
    font-size:11px; color:var(--t3); background:var(--card); border-top:1px solid var(--border); transition:.3s ease; }
  .statusbar .sp { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .legend { display:flex; align-items:center; gap:6px; }
  .legend i { width:9px; height:9px; border-radius:3px; display:inline-block; }
  .legend .hub { background:var(--accent); }
  .legend .nor { background:var(--card); border:1px solid var(--border); }
  .zctrl { display:flex; align-items:center; gap:4px; }
  .zctrl button { width:24px; height:24px; border-radius:6px; border:1px solid var(--border); background:var(--card);
    color:var(--t2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:.15s ease; }
  .zctrl button:hover { color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="title-center">MarkCraft — 知识图谱（视觉精修原型）</div>
      <div class="title-right">
        <button class="ico-btn" id="themeBtn" title="切换明暗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="body">
      <aside class="sidebar">
        <div class="brand"><div class="logo">M</div><div class="name">MarkCraft</div></div>
        <nav class="nav">
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg>笔记
          </div>
          <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.3l3 9M15.8 7.3l-3 9"/></svg>知识图谱
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 18v2M16 18v2"/></svg>白板
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>知识库
          </div>
        </nav>
        <div class="tree-head">文件</div>
        <div class="tree">
          <div class="tree-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>我的笔记
          </div>
          <div class="tree-item active"><span class="depth"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/></svg>双主题设计稿.md
          </div>
          <div class="tree-item"><span class="depth"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/></svg>每日规划.md
          </div>
          <div class="tree-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>研究资料
          </div>
        </div>
      </aside>

      <section class="main">
        <div class="topbar">
          <div class="crumb">知识库 <span style="color:var(--t3)">/</span> <b>双链图谱</b></div>
          <div class="search-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            搜索节点、标签、关系…
            <span class="kbd">⌘K</span>
          </div>
          <div class="seg">
            <button class="on">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.3l3 9M15.8 7.3l-3 9"/></svg>图谱
            </button>
            <button>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>列表
            </button>
          </div>
        </div>

        <div class="graph-wrap">
          <div class="canvas">
            <div class="grid"></div>
            <svg viewBox="0 0 720 420" preserveAspectRatio="xMidYMid meet">
              <!-- edges -->
              <g stroke="var(--edge)" stroke-width="1.5" fill="none" opacity="0.9">
                <path d="M360 78 L342 138"/><path d="M360 78 L168 196"/><path d="M360 78 L548 196"/>
                <path d="M360 78 L128 318"/><path d="M360 78 L352 318"/><path d="M342 158 L168 196"/>
                <path d="M342 158 L520 300"/><path d="M168 216 L548 216"/><path d="M352 338 L520 300"/>
                <path d="M632 318 L352 338"/><path d="M548 216 L632 318"/>
              </g>
              <!-- node: MarkCraft hub -->
              <g class="gnode" onclick="select('MarkCraft','中心节点','8 篇关联')">
                <rect x="300" y="52" width="120" height="36" rx="9" style="fill:var(--accent)"/>
                <text x="360" y="75" text-anchor="middle" style="fill:#fff" font-size="13" font-weight="600">MarkCraft</text>
              </g>
              <!-- node: 双主题系统 (accent) -->
              <g class="gnode" onclick="select('双主题系统','主题模块','5 篇关联')">
                <rect x="282" y="140" width="120" height="34" rx="9" style="fill:var(--card);stroke:var(--accent)" stroke-width="1.6"/>
                <text x="342" y="162" text-anchor="middle" style="fill:var(--accent)" font-size="12.5" font-weight="600">双主题系统</text>
              </g>
              <!-- others -->
              <g class="gnode" onclick="select('编辑器内核','核心组件','3 篇关联')">
                <rect x="108" y="198" width="120" height="34" rx="9" style="fill:var(--card);stroke:var(--border)"/>
                <text x="168" y="220" text-anchor="middle" style="fill:var(--t2)" font-size="12.5">编辑器内核</text>
              </g>
              <g class="gnode" onclick="select('知识图谱','功能模块','4 篇关联')">
                <rect x="488" y="198" width="120" height="34" rx="9" style="fill:var(--card);stroke:var(--border)"/>
                <text x="548" y="220" text-anchor="middle" style="fill:var(--t2)" font-size="12.5">知识图谱</text>
              </g>
              <g class="gnode" onclick="select('白板','功能模块','2 篇关联')">
                <rect x="68" y="318" width="120" height="34" rx="9" style="fill:var(--card);stroke:var(--border)"/>
                <text x="128" y="340" text-anchor="middle" style="fill:var(--t2)" font-size="12.5">白板</text>
              </g>
              <g class="gnode" onclick="select('博客','发布模块','3 篇关联')">
                <rect x="292" y="318" width="120" height="34" rx="9" style="fill:var(--card);stroke:var(--border)"/>
                <text x="352" y="340" text-anchor="middle" style="fill:var(--t2)" font-size="12.5">博客</text>
              </g>
              <g class="gnode" onclick="select('PDF 导出','导出模块','2 篇关联')">
                <rect x="460" y="300" width="120" height="34" rx="9" style="fill:var(--card);stroke:var(--border)"/>
                <text x="520" y="322" text-anchor="middle" style="fill:var(--t2)" font-size="12.5">PDF 导出</text>
              </g>
              <g class="gnode" onclick="select('每日笔记','笔记类型','2 篇关联')">
                <rect x="572" y="318" width="120" height="34" rx="9" style="fill:var(--card);stroke:var(--border)"/>
                <text x="632" y="340" text-anchor="middle" style="fill:var(--t2)" font-size="12.5">每日笔记</text>
              </g>
            </svg>
          </div>

          <aside class="detail">
            <div class="detail-head">
              <div class="ni">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.3l3 9M15.8 7.3l-3 9"/></svg>
              </div>
              <div>
                <div class="nt" id="dName">双主题系统</div>
                <div class="ns" id="dSub">主题模块</div>
              </div>
              <span class="tag" style="margin-left:auto">accent</span>
            </div>
            <div class="detail-body">
              <div class="meta-row"><span class="k">关联节点</span><span class="v" id="dRel">5</span></div>
              <div class="meta-row"><span class="k">反向链接</span><span class="v">12</span></div>
              <div class="meta-row"><span class="k">最后编辑</span><span class="v">今天 14:20</span></div>
              <div class="list-cap">关联节点</div>
              <div class="link-item"><span class="dot"></span>MarkCraft</div>
              <div class="link-item"><span class="dot"></span>编辑器内核</div>
              <div class="link-item"><span class="dot"></span>PDF 导出</div>
              <div class="link-item"><span class="dot"></span>博客</div>
              <div class="link-item"><span class="dot"></span>每日笔记</div>
            </div>
          </aside>
        </div>

        <div class="statusbar">
          <span><span class="dot" style="background:var(--success);width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle"></span>已索引</span>
          <span>节点 8 · 连线 11</span>
          <span class="sp">
            <span class="legend"><i class="hub"></i>中心 <i class="nor"></i>普通</span>
            <span class="zctrl">
              <button>−</button><span style="color:var(--t2)">100%</span><button>+</button>
            </span>
          </span>
        </div>
      </section>
    </div>
  </div>

<script>
  const root = document.documentElement;
  document.getElementById('themeBtn').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  }));
  function select(name, sub, rel){
    document.getElementById('dName').textContent = name;
    document.getElementById('dSub').textContent = sub;
    document.getElementById('dRel').textContent = rel.replace(/[^0-9]/g,'');
  }
</script>
</body>
</html>
