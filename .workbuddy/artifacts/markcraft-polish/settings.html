<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MarkCraft — 视觉精修原型 · 设置</title>
<style>
  :root {
    --page:#F6F7F9; --panel:#EEF0F4; --card:#FFFFFF; --border:#E3E6EC; --edge:#E2E4EC;
    --t1:#1A1D24; --t2:#5A606B; --t3:#8A909C; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.10);
    --elev-1:0 1px 2px rgba(20,24,36,.05),0 1px 3px rgba(20,24,36,.06);
    --elev-2:0 6px 16px rgba(20,24,36,.10);
    --elev-3:0 18px 48px rgba(20,24,36,.20),0 4px 12px rgba(20,24,36,.12);
    --r-win:14px; --r-panel:10px; --r-ctrl:8px; --r-chip:7px; --sb:#F0F2F6;
  }
  [data-theme="dark"] {
    --page:#14161C; --panel:#181B22; --card:#1C1F27; --border:#2A2E38; --edge:#333845;
    --t1:#E8EAF0; --t2:#9AA0AC; --t3:#6B7180; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.14);
    --elev-1:0 1px 2px rgba(0,0,0,.35);
    --elev-2:0 6px 16px rgba(0,0,0,.45);
    --elev-3:0 18px 48px rgba(0,0,0,.60),0 4px 12px rgba(0,0,0,.45);
    --sb:#20232C;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Inter',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--page); color:var(--t1); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px; transition:.3s ease;
  }
  .window { width:1080px; height:680px; border-radius:var(--r-win); background:var(--panel);
    box-shadow:var(--elev-3); overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--border); transition:.3s ease; }
  .titlebar { height:46px; flex:0 0 46px; display:flex; align-items:center; padding:0 14px;
    background:var(--card); border-bottom:1px solid var(--border); transition:.3s ease; }
  .traffic { display:flex; gap:8px; }
  .traffic i { width:12px; height:12px; border-radius:50%; display:block; }
  .traffic .r{background:#FF5F57;} .traffic .y{background:#FEBC2E;} .traffic .g{background:#28C840;}
  .title-center { flex:1; text-align:center; font-size:13px; font-weight:500; color:var(--t2); letter-spacing:.2px; }
  .title-right { display:flex; gap:6px; }
  .ico-btn { width:30px; height:30px; border-radius:var(--r-ctrl); display:flex; align-items:center; justify-content:center;
    color:var(--t2); cursor:pointer; border:1px solid transparent; background:transparent; transition:.15s ease; }
  .ico-btn:hover { background:var(--accent-soft); color:var(--accent); }
  .ico-btn:active { transform:scale(.96); }
  .ico-btn svg { width:16px; height:16px; }
  .body { flex:1; display:flex; min-height:0; }
  .sidebar { width:240px; flex:0 0 240px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:14px 10px; transition:.3s ease; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 14px; }
  .brand .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--accent),#8AA2FF);
    color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:var(--elev-1); }
  .brand .name { font-size:14px; font-weight:600; color:var(--t1); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-ctrl);
    font-size:13px; color:var(--t2); cursor:pointer; position:relative; transition:.15s ease; }
  .nav-item svg { width:17px; height:17px; }
  .nav-item:hover { background:var(--card); color:var(--t1); }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .nav-item.active::before { content:""; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:3px; background:var(--accent); }
  /* main dimmed behind modal */
  .main { flex:1; position:relative; background:var(--page); transition:.3s ease; }
  .behind { position:absolute; inset:0; opacity:.5; padding:40px; filter:saturate(.7); }
  .behind h1 { font-size:22px; color:var(--t1); font-weight:600; margin-bottom:10px; }
  .behind p { color:var(--t2); font-size:14px; line-height:1.7; max-width:520px; }
  .scrim { position:absolute; inset:0; background:rgba(10,12,18,.38); backdrop-filter:blur(2px); }
  /* settings modal */
  .modal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:660px; height:476px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-panel); box-shadow:var(--elev-3);
    display:flex; flex-direction:column; overflow:hidden; transition:.3s ease; }
  .modal-head { height:52px; flex:0 0 52px; display:flex; align-items:center; padding:0 18px; border-bottom:1px solid var(--border); }
  .modal-head .mt { font-size:15px; font-weight:600; color:var(--t1); }
  .modal-head .close { margin-left:auto; }
  .modal-body { flex:1; display:flex; min-height:0; }
  .modal-nav { width:172px; flex:0 0 172px; background:var(--panel); border-right:1px solid var(--border);
    padding:14px 10px; display:flex; flex-direction:column; gap:3px; transition:.3s ease; }
  .mnav-item { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--r-ctrl);
    font-size:13px; color:var(--t2); cursor:pointer; transition:.15s ease; }
  .mnav-item svg { width:16px; height:16px; }
  .mnav-item:hover { background:var(--card); color:var(--t1); }
  .mnav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .modal-content { flex:1; padding:22px 24px; overflow:auto; }
  .sec-title { font-size:11px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.6px; margin:0 0 12px; }
  .sec-title:not(:first-child) { margin-top:26px; }
  .field { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px dashed var(--border); }
  .field:last-child { border-bottom:none; }
  .field .fl { display:flex; flex-direction:column; gap:3px; }
  .field .fl .name { font-size:13.5px; color:var(--t1); font-weight:500; }
  .field .fl .desc { font-size:12px; color:var(--t3); }
  /* segmented */
  .seg { display:flex; background:var(--page); border:1px solid var(--border); border-radius:var(--r-ctrl); padding:3px; gap:2px; }
  .seg button { border:none; background:transparent; color:var(--t2); font-size:12px; padding:6px 13px;
    border-radius:6px; cursor:pointer; font-family:inherit; transition:.15s ease; display:flex; align-items:center; gap:6px; }
  .seg button svg { width:14px; height:14px; }
  .seg button.on { background:var(--card); color:var(--t1); box-shadow:var(--elev-1); font-weight:500; }
  /* toggle */
  .toggle { width:42px; height:24px; border-radius:999px; background:var(--accent); position:relative; cursor:pointer; transition:.2s ease; flex:0 0 42px; }
  .toggle.off { background:var(--border); }
  .toggle::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:#fff; box-shadow:var(--elev-1); transition:.2s ease; }
  .toggle:not(.off)::after { left:21px; }
  .footer { height:50px; flex:0 0 50px; display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:0 18px; border-top:1px solid var(--border); }
  .btn { font-family:inherit; font-size:13px; padding:8px 16px; border-radius:var(--r-ctrl); cursor:pointer; transition:.15s ease; border:1px solid transparent; }
  .btn.ghost { background:var(--page); color:var(--t2); border-color:var(--border); }
  .btn.ghost:hover { color:var(--t1); border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; box-shadow:var(--elev-1); }
  .btn.primary:hover { transform:translateY(-1px); box-shadow:var(--elev-2); }
  .btn.primary:active { transform:scale(.98); }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="title-center">MarkCraft — 设置（视觉精修原型）</div>
      <div class="title-right">
        <button class="ico-btn" id="themeBtn" title="切换明暗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="body">
      <aside class="sidebar">
        <div class="brand"><div class="logo">M</div><div class="name">MarkCraft</div></div>
        <nav class="nav">
          <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg>笔记
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.3l3 9M15.8 7.3l-3 9"/></svg>知识图谱
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 18v2M16 18v2"/></svg>白板
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>知识库
          </div>
        </nav>
      </aside>

      <section class="main">
        <div class="behind">
          <h1>双主题设计稿</h1>
          <p>这是被设置对话框遮挡的编辑器内容预览。设置模态卡片采用 elev-3 明显投影 + 1px 描边，叠加半透明 scrim，凸显桌面级层级感，区别于网页化的浅浮层。</p>
        </div>
        <div class="scrim"></div>

        <div class="modal">
          <div class="modal-head">
            <div class="mt">设置</div>
            <button class="ico-btn close" title="关闭">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="modal-nav">
              <div class="mnav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>外观
              </div>
              <div class="mnav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4V10H4zM10 20h4V4h-4zM16 20h4v-7h-4z"/></svg>编辑器
              </div>
              <div class="mnav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>导出
              </div>
              <div class="mnav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>关于
              </div>
            </div>
            <div class="modal-content">
              <div class="sec-title">主题</div>
              <div class="field">
                <div class="fl"><span class="name">外观模式</span><span class="desc">选择浅色、深色或跟随系统</span></div>
                <div class="seg" id="themeSeg">
                  <button>浅色</button>
                  <button>深色</button>
                  <button class="on">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>跟随系统
                  </button>
                </div>
              </div>

              <div class="sec-title">密度</div>
              <div class="field">
                <div class="fl"><span class="name">界面密度</span><span class="desc">紧凑模式适合桌面多窗口</span></div>
                <div class="seg" id="densSeg">
                  <button class="on">舒适</button>
                  <button>紧凑</button>
                </div>
              </div>

              <div class="sec-title">编辑器</div>
              <div class="field">
                <div class="fl"><span class="name">自动保存</span><span class="desc">编辑后 500ms 本地持久化</span></div>
                <div class="toggle" onclick="this.classList.toggle('off')"></div>
              </div>
              <div class="field">
                <div class="fl"><span class="name">显示行号</span><span class="desc">编辑区左侧显示行号栏</span></div>
                <div class="toggle off" onclick="this.classList.toggle('off')"></div>
              </div>
              <div class="field">
                <div class="fl"><span class="name">Markdown 实时预览</span><span class="desc">分屏模式右侧渲染</span></div>
                <div class="toggle" onclick="this.classList.toggle('off')"></div>
              </div>
            </div>
          </div>
          <div class="footer">
            <button class="btn ghost">取消</button>
            <button class="btn primary">完成</button>
          </div>
        </div>
      </section>
    </div>
  </div>

<script>
  const root = document.documentElement;
  document.getElementById('themeBtn').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  document.querySelectorAll('#themeSeg button, #densSeg button').forEach(seg => {
    seg.addEventListener('click', () => {
      const group = seg.parentElement;
      group.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      seg.classList.add('on');
    });
  });
</script>
</body>
</html>
