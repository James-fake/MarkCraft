<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MarkCraft — 视觉精修原型 · 白板</title>
<style>
  :root {
    --page:#F6F7F9; --panel:#EEF0F4; --card:#FFFFFF; --border:#E3E6EC; --edge:#E2E4EC;
    --t1:#1A1D24; --t2:#5A606B; --t3:#8A909C; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.10);
    --success:#1FA45C; --success-soft:rgba(31,164,92,.12);
    --elev-1:0 1px 2px rgba(20,24,36,.05),0 1px 3px rgba(20,24,36,.06);
    --elev-2:0 6px 16px rgba(20,24,36,.10);
    --elev-3:0 18px 48px rgba(20,24,36,.20),0 4px 12px rgba(20,24,36,.12);
    --r-win:14px; --r-panel:10px; --r-ctrl:8px; --r-chip:7px; --sb:#F0F2F6;
  }
  [data-theme="dark"] {
    --page:#14161C; --panel:#181B22; --card:#1C1F27; --border:#2A2E38; --edge:#333845;
    --t1:#E8EAF0; --t2:#9AA0AC; --t3:#6B7180; --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.14);
    --success:#3DD68C; --success-soft:rgba(61,214,140,.14);
    --elev-1:0 1px 2px rgba(0,0,0,.35);
    --elev-2:0 6px 16px rgba(0,0,0,.45);
    --elev-3:0 18px 48px rgba(0,0,0,.60),0 4px 12px rgba(0,0,0,.45);
    --sb:#20232C;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Inter',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--page); color:var(--t1); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px; transition:.3s ease;
  }
  .window { width:1080px; height:680px; border-radius:var(--r-win); background:var(--panel);
    box-shadow:var(--elev-3); overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--border); transition:.3s ease; }
  .titlebar { height:46px; flex:0 0 46px; display:flex; align-items:center; padding:0 14px;
    background:var(--card); border-bottom:1px solid var(--border); transition:.3s ease; }
  .traffic { display:flex; gap:8px; }
  .traffic i { width:12px; height:12px; border-radius:50%; display:block; }
  .traffic .r{background:#FF5F57;} .traffic .y{background:#FEBC2E;} .traffic .g{background:#28C840;}
  .title-center { flex:1; text-align:center; font-size:13px; font-weight:500; color:var(--t2); letter-spacing:.2px; }
  .title-right { display:flex; gap:6px; }
  .ico-btn { width:30px; height:30px; border-radius:var(--r-ctrl); display:flex; align-items:center; justify-content:center;
    color:var(--t2); cursor:pointer; border:1px solid transparent; background:transparent; transition:.15s ease; }
  .ico-btn:hover { background:var(--accent-soft); color:var(--accent); }
  .ico-btn:active { transform:scale(.96); }
  .ico-btn svg { width:16px; height:16px; }
  .body { flex:1; display:flex; min-height:0; }
  .sidebar { width:240px; flex:0 0 240px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:14px 10px; transition:.3s ease; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 14px; }
  .brand .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--accent),#8AA2FF);
    color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:var(--elev-1); }
  .brand .name { font-size:14px; font-weight:600; color:var(--t1); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-ctrl);
    font-size:13px; color:var(--t2); cursor:pointer; position:relative; transition:.15s ease; }
  .nav-item svg { width:17px; height:17px; }
  .nav-item:hover { background:var(--card); color:var(--t1); }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .nav-item.active::before { content:""; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:3px; background:var(--accent); }
  .tree-head { font-size:11px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.6px; padding:16px 10px 6px; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--page); transition:.3s ease; }
  .topbar { height:50px; flex:0 0 50px; display:flex; align-items:center; gap:12px; padding:0 16px;
    border-bottom:1px solid var(--border); background:var(--card); transition:.3s ease; }
  .crumb { font-size:13px; color:var(--t2); display:flex; align-items:center; gap:6px; }
  .crumb b { color:var(--t1); font-weight:600; }
  .search-chip { margin-left:8px; display:flex; align-items:center; gap:8px; padding:7px 12px; min-width:180px;
    background:var(--page); border:1px solid var(--border); border-radius:var(--r-chip); color:var(--t3);
    font-size:12px; cursor:text; transition:.15s ease; box-shadow:var(--elev-1); }
  .search-chip:hover { border-color:var(--accent); }
  .search-chip svg { width:14px; height:14px; }
  .seg { margin-left:auto; display:flex; background:var(--page); border:1px solid var(--border);
    border-radius:var(--r-ctrl); padding:3px; gap:2px; }
  .seg button { border:none; background:transparent; color:var(--t2); font-size:12px; padding:5px 11px;
    border-radius:6px; cursor:pointer; font-family:inherit; transition:.15s ease; }
  .seg button.on { background:var(--card); color:var(--t1); box-shadow:var(--elev-1); font-weight:500; }
  .canvas { flex:1; position:relative; overflow:hidden; background:var(--page); transition:.3s ease; }
  .canvas .grid { position:absolute; inset:0; opacity:.55;
    background-image:radial-gradient(var(--border) 1px, transparent 1px); background-size:24px 24px; }
  .canvas svg { position:absolute; inset:0; width:100%; height:100%; }
  /* floating toolbar */
  .toolbar { position:absolute; left:18px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:4px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-panel); padding:6px; box-shadow:var(--elev-2); }
  .tool { width:36px; height:36px; border-radius:var(--r-ctrl); display:flex; align-items:center; justify-content:center;
    color:var(--t2); cursor:pointer; transition:.15s ease; }
  .tool svg { width:18px; height:18px; }
  .tool:hover { background:var(--accent-soft); color:var(--accent); }
  .tool.active { background:var(--accent); color:#fff; }
  .tool-sep { height:1px; background:var(--border); margin:3px 4px; }
  .zctrl { position:absolute; right:18px; bottom:18px; display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-ctrl); padding:5px 8px; box-shadow:var(--elev-2); }
  .zctrl button { width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--card);
    color:var(--t2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; transition:.15s ease; }
  .zctrl button:hover { color:var(--accent); border-color:var(--accent); }
  .zctrl .zval { font-size:12px; color:var(--t2); min-width:40px; text-align:center; }
  .tag-float { position:absolute; right:18px; top:18px; display:flex; gap:6px; }
  .chip { font-size:11px; color:var(--t2); background:var(--card); border:1px solid var(--border); border-radius:999px;
    padding:4px 10px; box-shadow:var(--elev-1); }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="title-center">MarkCraft — 白板（视觉精修原型）</div>
      <div class="title-right">
        <button class="ico-btn" id="themeBtn" title="切换明暗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="body">
      <aside class="sidebar">
        <div class="brand"><div class="logo">M</div><div class="name">MarkCraft</div></div>
        <nav class="nav">
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg>笔记
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.3l3 9M15.8 7.3l-3 9"/></svg>知识图谱
          </div>
          <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 18v2M16 18v2"/></svg>白板
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>知识库
          </div>
        </nav>
        <div class="tree-head">画布</div>
        <div class="nav" style="gap:1px">
          <div class="nav-item">无标题画布 1</div>
          <div class="nav-item">架构图</div>
          <div class="nav-item">头脑风暴</div>
        </div>
      </aside>

      <section class="main">
        <div class="topbar">
          <div class="crumb">白板 <span style="color:var(--t3)">/</span> <b>无标题画布 1</b></div>
          <div class="search-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            在画布中查找…
          </div>
          <div class="seg">
            <button class="on">选择</button>
            <button>适应</button>
            <button>100%</button>
          </div>
        </div>

        <div class="canvas">
          <div class="grid"></div>
          <svg viewBox="0 0 840 560" preserveAspectRatio="xMidYMid meet">
            <!-- arrow -->
            <path d="M250 200 L380 200" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#ah)"/>
            <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
              <path d="M0 0 L9 4.5 L0 9 z" fill="var(--accent)"/></marker></defs>
            <!-- sticky note -->
            <rect x="120" y="150" width="130" height="100" rx="10" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="1.2"/>
            <text x="135" y="182" style="fill:var(--accent)" font-size="13" font-weight="600">想法</text>
            <text x="135" y="206" style="fill:var(--t2)" font-size="12">把双主题设计</text>
            <text x="135" y="226" style="fill:var(--t2)" font-size="12">系统落地到白板</text>
            <!-- rectangle card -->
            <rect x="400" y="150" width="180" height="100" rx="10" style="fill:var(--card);stroke:var(--border)" stroke-width="1.4"/>
            <text x="416" y="184" style="fill:var(--t1)" font-size="13" font-weight="600">组件库</text>
            <text x="416" y="208" style="fill:var(--t3)" font-size="12">Button · Card · Modal</text>
            <text x="416" y="228" style="fill:var(--t3)" font-size="12">Toolbar · Tooltip</text>
            <!-- ellipse -->
            <ellipse cx="660" cy="200" rx="70" ry="48" style="fill:var(--card);stroke:var(--border)" stroke-width="1.4"/>
            <text x="660" y="205" text-anchor="middle" style="fill:var(--t2)" font-size="12.5">导出 PNG</text>
            <!-- freehand-ish path -->
            <path d="M180 360 C 260 320, 340 420, 440 360 S 600 320, 700 380" stroke="var(--t3)" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
            <!-- text label -->
            <text x="200" y="430" style="fill:var(--t1)" font-size="14" font-weight="600">草图区</text>
            <text x="200" y="452" style="fill:var(--t3)" font-size="12">拖拽图形、连线与便签搭建想法</text>
          </svg>

          <div class="toolbar">
            <div class="tool active" title="选择">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6z"/></svg>
            </div>
            <div class="tool" title="矩形">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
            </div>
            <div class="tool" title="椭圆">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
            </div>
            <div class="tool" title="箭头">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L20 4M20 4h-7M20 4v7"/></svg>
            </div>
            <div class="tool-sep"></div>
            <div class="tool" title="画笔">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8a2 2 0 0 0-3-3L5 16z"/></svg>
            </div>
            <div class="tool" title="文本">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v13"/></svg>
            </div>
            <div class="tool" title="便签">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v10l-5 6H5z"/><path d="M14 20v-6h6"/></svg>
            </div>
            <div class="tool-sep"></div>
            <div class="tool" title="橡皮">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l7 7 9-9-7-7z"/><path d="M9 9l6 6"/></svg>
            </div>
          </div>

          <div class="tag-float">
            <span class="chip">3 个图形</span>
            <span class="chip">1 条连线</span>
          </div>

          <div class="zctrl">
            <button>−</button><span class="zval">100%</span><button>+</button>
          </div>
        </div>
      </section>
    </div>
  </div>

<script>
  const root = document.documentElement;
  document.getElementById('themeBtn').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  document.querySelectorAll('.tool').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tool').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
  }));
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  }));
</script>
</body>
</html>
