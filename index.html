<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标：相对路径，兼容 Electron file:// 与 web 两种加载（原 /vite.svg 为模板残留死链） -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- E2 PWA：主题色与 iOS 独立窗口支持（manifest / SW 注册由 vite-plugin-pwa 自动注入） -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarkCraft" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>MarkCraft</title>
    <script>
      // 在CSS渲染前同步设置主题，避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('app-theme-preference');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <script>
      // 在CSS渲染前同步设置界面密度，避免闪烁
      // 与 densityStore 同一本地存储键 mc-sidebar-density（默认 compact），保证首屏密度与真实应用一致
      (function() {
        try {
          var d = localStorage.getItem('mc-sidebar-density') || 'compact';
          document.documentElement.setAttribute('data-density', d);
        } catch(e) {}
      })();
    </script>
    <script>
      // 开屏底色：**每次启动**都先给 <html> 挂近黑底色，避免 body 白闪（2026-10-09 起不再区分首启）。
      // 与 body 内的开屏构建脚本共用同一套类名；主界面首绘后一并移除。
      (function() {
        try { document.documentElement.classList.add('mc-booting'); } catch(e) {}
      })();
    </script>
    <style id="mc-splash-css">
      /* 开屏动画（打字机逐字浮现 + 光标）—— **每次启动都播**（2026-10-09 起）。
         内联于 HTML：先于模块包渲染，使动画与主包下载并行（不延长首屏可用时间）；
         主界面首绘后由 aurora-main.tsx 调 window.__mcSplash.done() 触发淡出。
         底色 #0A0B0F = --mc-bg-window（与 #aurora-root 同源）→ 衔接无白闪。
         字号 clamp(40px, min(5vw, 10vh), 72px)：旧值 28/3.2vw/40 在任何常见宽度下
         都会被顶到 40px 上限（"响应式"是假的），故把上限提到 72px 作为真正的字号；
         min(5vw, 10vh) 防止矮窗口（如 1920×600）里字占过高。
         blur 与光标宽度一并改成 em：随字号等比缩放，否则放大后"显影感"与光标会偏细弱。
         分段时长（用户反馈初版「偏短/太快」后加长）：
           打字（9 字 × 90ms + 420ms）≈ 1.14s → 图标从左侧撞入 0.62s → 落位后停顿 → 溶解离场 0.32s，
         最短停留 MIN_TOTAL = 2200ms（应用未就绪则继续停留，不会截断动画）。 */
      html.mc-booting,
      html.mc-booting body { background-color: #0A0B0F; }
      #mc-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        background: #0A0B0F;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        opacity: 1;
        transition: opacity 320ms cubic-bezier(0.4, 0, 1, 1);
      }
      #mc-splash.mc-splash--leaving { opacity: 0; pointer-events: none; }
      #mc-splash .mc-splash__word {
        position: relative; z-index: 0;
        display: inline-flex; align-items: baseline;
        /* 字体：优先 LL Prismaset Five（Lineto 基于 Rudolf Koch「Prisma」的棱镜体重作版）。
           ⚠️ 该字体为商业授权字体，未随应用内置 —— 本机已安装则自动命中；
           未安装时优雅回退到 Inter / 系统无衬线（见 docs 说明）。 */
        font-family: 'LL Prismaset Five', 'Prismaset Five', 'LL Prisma Five', 'Prisma',
                     'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: clamp(40px, min(5vw, 10vh), 72px); font-weight: 600;
        letter-spacing: -0.02em; color: #E8ECF4; line-height: 1.1;
        transform-origin: 50% 50%;
        transition: transform 320ms cubic-bezier(0.4, 0, 1, 1),
                    filter 320ms cubic-bezier(0.4, 0, 1, 1),
                    opacity 320ms cubic-bezier(0.4, 0, 1, 1);
      }
      /* 撞击瞬间给字一个极轻的顶推，坐实「撞上了」（不加 forwards，播完自动回位） */
      #mc-splash .mc-splash__word--nudged {
        animation: mc-splash-nudge 320ms cubic-bezier(0.36, 0, 0.66, -0.56)
          var(--nudge-delay, 1730ms);
      }
      @keyframes mc-splash-nudge {
        0%   { transform: translateX(0); }
        35%  { transform: translateX(0.07em); }
        100% { transform: translateX(0); }
      }
      /* 应用图标：从左侧飞入撞到首字母 M，停驻在 MarkCraft 左侧（绝对定位，
         故打字阶段文字始终居中，不会被图标占位推偏） */
      #mc-splash .mc-splash__icon {
        position: absolute; top: 50%; right: 100%;
        width: 1.08em; height: 1.08em; margin: -0.54em 0.14em 0 0;
        opacity: 0;
        animation: mc-splash-icon-hit 620ms cubic-bezier(0.32, 0, 0.12, 1)
          var(--icon-delay, 1230ms) forwards;
      }
      #mc-splash .mc-splash__icon svg { display: block; width: 100%; height: 100%; }
      @keyframes mc-splash-icon-hit {
        0%   { opacity: 0; transform: translateX(-9em) scale(0.70) rotate(-12deg); }
        55%  { opacity: 1; }
        86%  { opacity: 1; transform: translateX(0.08em) scale(1.08) rotate(0deg); }
        100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
      }
      /* 离场：字随底色一起「溶解」并微微放大 —— 比单纯淡出更有收束感 */
      #mc-splash.mc-splash--leaving .mc-splash__word {
        transform: scale(1.045);
        filter: blur(0.05em);
        opacity: 0;
      }
      /* 字后一层极淡辉光，给纯黑底一点纵深（进场呼吸一次即止，不循环） */
      #mc-splash .mc-splash__glow {
        position: absolute; left: 50%; top: 50%; z-index: -1;
        width: 3.4em; height: 3.4em; margin: -1.7em 0 0 -1.7em;
        border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(124, 140, 255, 0.20) 0%, rgba(124, 140, 255, 0) 62%);
        opacity: 0;
        animation: mc-splash-glow 1000ms cubic-bezier(0.22, 1, 0.36, 1) 160ms forwards;
      }
      @keyframes mc-splash-glow {
        from { opacity: 0; transform: scale(0.86); }
        to   { opacity: 1; transform: scale(1); }
      }
      #mc-splash .mc-splash__char {
        display: inline-block; opacity: 0;
        animation: mc-splash-char 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: calc(var(--i) * var(--stagger, 70ms));
        will-change: opacity, transform, filter;
      }
      @keyframes mc-splash-char {
        from { opacity: 0; transform: translateY(0.16em); filter: blur(0.15em); }
        to   { opacity: 1; transform: translateY(0);      filter: blur(0); }
      }
      #mc-splash .mc-splash__caret {
        display: inline-block; width: 0.05em; height: 1.05em; margin-left: 0.07em;
        border-radius: 0.03em; background: #7C8CFF; opacity: 0;
        animation: mc-splash-caret-blink 1.05s step-end var(--caret-delay, 700ms) infinite;
      }
      @keyframes mc-splash-caret-blink {
        0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #mc-splash .mc-splash__char {
          animation-name: mc-splash-char-fade;
          animation-duration: 220ms; animation-delay: 0ms;
        }
        #mc-splash .mc-splash__glow { display: none; }
        #mc-splash .mc-splash__caret { display: none; }
        /* 降低动效：图标直接就位（不飞入、不顶推），但仍示人以完整构图 */
        #mc-splash .mc-splash__icon { animation: none; opacity: 1; }
        #mc-splash .mc-splash__word--nudged { animation: none; }
      }
      @keyframes mc-splash-char-fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <script>
      // 浏览器环境 polyfill：@excalidraw/excalidraw 的入口在浏览器端引用
      // process.env.IS_PREACT / NODE_ENV，提供最小 process 全局以避免 "process is not defined"。
      // 生产构建由 vite.config 的 define 在构建期将 process.env.* 替换为字面量，此处仅作运行时兜底。
      window.process = window.process || { env: { NODE_ENV: 'development', IS_PREACT: 'false' } };
    </script>
    <script>
      // 让 Excalidraw 从本地（同源）加载运行时资源（vendor chunk / 字体 / wasm），
      // 而不是默认的 unpkg.com。否则在离线 / 防火墙 / 浏览器跟踪防护（如 Edge Tracking
      // Prevention 拦截 unpkg 的 localStorage）环境下，Excalidraw 的 vendor chunk 会
      // 加载失败（ChunkLoadError）导致白板无法初始化、工具栏全部无响应。
      // 该路径由 vite.config 的内联插件在 dev / preview / build 三种模式下提供本地服务。
      window.EXCALIDRAW_ASSET_PATH = '/excalidraw-assets/';
    </script>
  </head>
  <body>
    <div id="aurora-root"></div>
    <script>
      // 开屏动画（打字机逐字浮现 + 光标）—— **每次启动都播**（2026-10-09 起去掉「仅首启」判断：
      // 原先靠 localStorage 的 mc-splash-seen 只播一次，用户明确要求每次都播）。
      // 内联执行、先于底部 module bundle，使动画与主包下载「并行」进行——开屏只遮盖加载，不延长加载。
      // 主界面首绘后由 aurora-main.tsx 调 window.__mcSplash.done() 触发淡出并移除。
      (function() {
        var STAGGER = 90;      // 逐字错峰间隔（用户反馈「偏短/太快」→ 由 70 放慢到 90，全文 ~810ms 打完）
        var CHAR_DUR = 420;    // 单字浮现时长（须与 CSS 的 mc-splash-char 一致，用于推算图标入场时刻）
        var MIN_TOTAL = 2200;  // 最短停留：打字 ~1.14s + 图标撞入 ~0.62s + 落位后停顿，由 1150 拉长
        var HARD_CAP = 5000;   // 硬兜底：超时强制让位（避免盖住错误页）
        var root = document.documentElement;
        function endBooting() { root.classList.remove('mc-booting'); }

        var t0 = performance.now();
        var word = 'MarkCraft';
        var reduced = false;
        try { reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

        // 打字全部完成 ≈ (n-1)*STAGGER + CHAR_DUR；图标紧接着撞入，撞击点 ≈ iconDelay + 0.86*620
        var revealEnd = (word.length - 1) * STAGGER + CHAR_DUR;
        var iconDelay = revealEnd + 90;
        var nudgeDelay = iconDelay + 500;

        var el = document.createElement('div');
        el.id = 'mc-splash';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-label', 'MarkCraft 正在启动');
        el.style.setProperty('--stagger', STAGGER + 'ms');
        el.style.setProperty('--icon-delay', iconDelay + 'ms');
        el.style.setProperty('--nudge-delay', nudgeDelay + 'ms');
        var w = document.createElement('div');
        w.className = 'mc-splash__word';
        w.setAttribute('aria-hidden', 'true');
        if (!reduced) {
          // 辉光垫在字后（z-index: -1），给纯黑底一点纵深
          var glow = document.createElement('span');
          glow.className = 'mc-splash__glow';
          w.appendChild(glow);
        }
        for (var i = 0; i < word.length; i++) {
          var s = document.createElement('span');
          s.className = 'mc-splash__char';
          s.style.setProperty('--i', String(i));
          s.textContent = word.charAt(i);
          w.appendChild(s);
        }
        if (!reduced) {
          var c = document.createElement('span');
          c.className = 'mc-splash__caret';
          c.style.setProperty('--caret-delay', (word.length * STAGGER) + 'ms');
          w.appendChild(c);
        }
        // 应用图标：内联 SVG（与 build/icon.svg 同源，用 path 画 M 避免依赖系统字体），
        // 不额外发请求，避免闪一下空位。动画由 CSS 驱动：从左侧飞入 → 撞到 M → 停驻左侧。
        var icon = document.createElement('span');
        icon.className = 'mc-splash__icon';
        icon.innerHTML =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
          '<rect width="512" height="512" rx="96" fill="#2563eb"/>' +
          '<rect x="120" y="88" width="272" height="336" rx="24" fill="#ffffff"/>' +
          '<path d="M176 336 L176 192 L216 192 L256 264 L296 192 L336 192 L336 336 L304 336 L304 248 L256 326 L208 248 L208 336 Z" fill="#2563eb"/>' +
          '<rect x="168" y="372" width="176" height="16" rx="8" fill="#2563eb" opacity="0.25"/>' +
          '</svg>';
        w.appendChild(icon);
        if (!reduced) w.classList.add('mc-splash__word--nudged');
        el.appendChild(w);
        document.body.appendChild(el);

        var dismissed = false;
        function remove() {
          if (el.parentNode) el.parentNode.removeChild(el);
          endBooting();
        }
        function leave() {
          if (dismissed) return;
          dismissed = true;
          el.classList.add('mc-splash--leaving');
          el.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 700); // transitionend 兜底
        }
        function done() {
          var wait = Math.max(0, MIN_TOTAL - (performance.now() - t0));
          setTimeout(leave, wait);
        }
        window.__mcSplash = { done: done, leave: leave };
        setTimeout(function() { if (!dismissed) leave(); }, HARD_CAP);
      })();
    </script>
    <script type="module" src="/src/aurora/aurora-main.tsx"></script>
  </body>
</html>
