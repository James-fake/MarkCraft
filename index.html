<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- E2 PWA：主题色与 iOS 独立窗口支持（manifest / SW 注册由 vite-plugin-pwa 自动注入） -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarkCraft" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>MarkCraft</title>
    <script>
      // 在CSS渲染前同步设置主题，避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('app-theme-preference');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <script>
      // 在CSS渲染前同步设置界面密度，避免闪烁
      // 与 densityStore 同一本地存储键 mc-sidebar-density（默认 compact），保证首屏密度与真实应用一致
      (function() {
        try {
          var d = localStorage.getItem('mc-sidebar-density') || 'compact';
          document.documentElement.setAttribute('data-density', d);
        } catch(e) {}
      })();
    </script>
    <script>
      // 首次启动开屏：仅当无「已看过」标记时，给 <html> 挂近黑引导底色，避免 body 白闪。
      // 与 body 内的开屏构建脚本共用同一 localStorage 键 mc-splash-seen。
      (function() {
        try {
          if (!localStorage.getItem('mc-splash-seen')) document.documentElement.classList.add('mc-booting');
        } catch(e) { document.documentElement.classList.add('mc-booting'); }
      })();
    </script>
    <style id="mc-splash-css">
      /* 首次启动开屏动画（打字机逐字浮现 + 光标）。
         内联于 HTML：先于模块包渲染，使动画与主包下载并行（不延长首屏可用时间）；
         主界面首绘后由 aurora-main.tsx 调 window.__mcSplash.done() 触发淡出。
         底色 #0A0B0F = --mc-bg-window（与 #aurora-root 同源）→ 衔接无白闪。 */
      html.mc-booting,
      html.mc-booting body { background-color: #0A0B0F; }
      #mc-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        background: #0A0B0F;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        opacity: 1;
        transition: opacity 300ms cubic-bezier(0.4, 0, 1, 1);
      }
      #mc-splash.mc-splash--leaving { opacity: 0; pointer-events: none; }
      #mc-splash .mc-splash__word {
        display: inline-flex; align-items: baseline;
        font-size: clamp(28px, 3.2vw, 40px); font-weight: 600;
        letter-spacing: -0.01em; color: #E8ECF4; line-height: 1.1;
      }
      #mc-splash .mc-splash__char {
        display: inline-block; opacity: 0;
        animation: mc-splash-char 480ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: calc(var(--i) * 95ms);
        will-change: opacity, transform, filter;
      }
      @keyframes mc-splash-char {
        from { opacity: 0; transform: translateY(0.16em); filter: blur(6px); }
        to   { opacity: 1; transform: translateY(0);      filter: blur(0); }
      }
      #mc-splash .mc-splash__caret {
        display: inline-block; width: 2px; height: 1.05em; margin-left: 3px;
        border-radius: 1px; background: #7C8CFF; opacity: 0;
        animation: mc-splash-caret-blink 1.05s step-end var(--caret-delay, 900ms) infinite;
      }
      @keyframes mc-splash-caret-blink {
        0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #mc-splash .mc-splash__char {
          animation-name: mc-splash-char-fade;
          animation-duration: 250ms; animation-delay: 0ms;
        }
        #mc-splash .mc-splash__caret { display: none; }
      }
      @keyframes mc-splash-char-fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <script>
      // 浏览器环境 polyfill：@excalidraw/excalidraw 的入口在浏览器端引用
      // process.env.IS_PREACT / NODE_ENV，提供最小 process 全局以避免 "process is not defined"。
      // 生产构建由 vite.config 的 define 在构建期将 process.env.* 替换为字面量，此处仅作运行时兜底。
      window.process = window.process || { env: { NODE_ENV: 'development', IS_PREACT: 'false' } };
    </script>
    <script>
      // 让 Excalidraw 从本地（同源）加载运行时资源（vendor chunk / 字体 / wasm），
      // 而不是默认的 unpkg.com。否则在离线 / 防火墙 / 浏览器跟踪防护（如 Edge Tracking
      // Prevention 拦截 unpkg 的 localStorage）环境下，Excalidraw 的 vendor chunk 会
      // 加载失败（ChunkLoadError）导致白板无法初始化、工具栏全部无响应。
      // 该路径由 vite.config 的内联插件在 dev / preview / build 三种模式下提供本地服务。
      window.EXCALIDRAW_ASSET_PATH = '/excalidraw-assets/';
    </script>
  </head>
  <body>
    <div id="aurora-root"></div>
    <script>
      // 首次启动开屏动画（打字机逐字浮现 + 光标）。内联执行、先于底部 module bundle，
      // 使动画与主包下载「并行」进行——开屏只遮盖加载，不延长加载。
      // 主界面首绘后由 aurora-main.tsx 调 window.__mcSplash.done() 触发淡出并移除。
      (function() {
        var SEEN = 'mc-splash-seen';
        var STAGGER = 95;      // 逐字错峰间隔
        var MIN_TOTAL = 1600;  // 最短停留（保证动画完整，不被「秒闪」）
        var HARD_CAP = 6000;   // 硬兜底：超时强制让位（避免盖住错误页）
        var root = document.documentElement;
        function endBooting() { root.classList.remove('mc-booting'); }

        var first;
        try { first = !localStorage.getItem(SEEN); } catch (e) { first = true; }
        if (!first) { endBooting(); return; }

        var t0 = performance.now();
        var word = 'MarkCraft';
        var reduced = false;
        try { reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

        var el = document.createElement('div');
        el.id = 'mc-splash';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-label', 'MarkCraft 正在启动');
        var w = document.createElement('div');
        w.className = 'mc-splash__word';
        w.setAttribute('aria-hidden', 'true');
        for (var i = 0; i < word.length; i++) {
          var s = document.createElement('span');
          s.className = 'mc-splash__char';
          s.style.setProperty('--i', String(i));
          s.textContent = word.charAt(i);
          w.appendChild(s);
        }
        if (!reduced) {
          var c = document.createElement('span');
          c.className = 'mc-splash__caret';
          c.style.setProperty('--caret-delay', (word.length * STAGGER) + 'ms');
          w.appendChild(c);
        }
        el.appendChild(w);
        document.body.appendChild(el);

        var dismissed = false;
        function remove() {
          if (el.parentNode) el.parentNode.removeChild(el);
          endBooting();
        }
        function leave() {
          if (dismissed) return;
          dismissed = true;
          el.classList.add('mc-splash--leaving');
          el.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 600); // transitionend 兜底
        }
        function done() {
          try { localStorage.setItem(SEEN, '1'); } catch (e) {}
          var wait = Math.max(0, MIN_TOTAL - (performance.now() - t0));
          setTimeout(leave, wait);
        }
        window.__mcSplash = { done: done, leave: leave };
        setTimeout(function() { if (!dismissed) leave(); }, HARD_CAP);
      })();
    </script>
    <script type="module" src="/src/aurora/aurora-main.tsx"></script>
  </body>
</html>
